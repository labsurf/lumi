<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuMi — Tu música</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231db954'/%3E%3Ctext x='50' y='72' font-size='58' text-anchor='middle' fill='%23000' font-weight='900' font-family='system-ui'%3ELM%3C/text%3E%3C/svg%3E">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1db954">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LuMi">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Estilos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ═══ Pantalla de Login / Registro ═══ -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand-icon">
          <i class="fa-solid fa-headphones-simple"></i>
        </div>
        <h1>LuMi</h1>
        <p>Tu música, tus reglas</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-auth="login">Iniciar sesión</button>
        <button class="auth-tab" data-auth="register">Crear cuenta</button>
      </div>

      <form id="authForm">
        <div class="auth-field">
          <label><i class="fa-solid fa-user"></i> Usuario</label>
          <input id="authUsername" type="text" autocomplete="username" placeholder="tu usuario" required minlength="3">
        </div>
        <div class="auth-field">
          <label><i class="fa-solid fa-lock"></i> Contraseña</label>
          <input id="authPassword" type="password" autocomplete="current-password" placeholder="tu contraseña" required minlength="4">
        </div>
        <div id="authError" class="auth-error"></div>
        <button id="authSubmit" type="submit" class="auth-submit">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Entrar</span>
        </button>
      </form>

      <p class="auth-footnote">
        Al crear una cuenta recibirás acceso a la playlist <b>Base</b> con las canciones destacadas.
      </p>
    </div>
  </div>

  <!-- ═══ App principal ═══ -->
  <div id="app" class="app hidden">
    <header>
      <div class="header-inner">
        <div class="brand">
          <div class="brand-icon">
            <i class="fa-solid fa-headphones-simple"></i>
          </div>
          <div class="brand-text">
            <h1>LuMi</h1>
            <span>Tu música, tus reglas</span>
          </div>
        </div>

                <div class="user-menu">
          <div class="user-info">
            <div class="user-name" id="userName">
              <i class="fa-solid fa-circle-user"></i>
              <span>—</span>
            </div>
            <div class="user-quota" id="userQuota">
              <i class="fa-solid fa-cloud-arrow-down"></i>
              <span>0/50</span>
            </div>
          </div>
          <a href="help.html" class="help-btn" title="Ayuda">
            <i class="fa-solid fa-circle-question"></i>
          </a>
          <button id="logoutBtn" class="logout-btn" title="Cerrar sesión">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>

      <nav class="tabs-bar">
        <div class="tabs">
          <button class="tab active" data-tab="library">
            <i class="fa-solid fa-compact-disc"></i>
            <span>Biblioteca</span>
          </button>
          <button class="tab" data-tab="charts">
            <i class="fa-solid fa-chart-simple"></i>
            <span>Charts</span>
          </button>
          <button class="tab hidden" id="adminTab" data-tab="admin">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Admin</span>
          </button>
        </div>
      </nav>
    </header>

    <!-- Vista: Biblioteca -->
    <main id="view-library" class="view active">
      <div class="toolbar">
        <div class="input-with-icon">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="search" type="text" placeholder="Buscar en tu biblioteca...">
        </div>

        <select id="sourceFilter" title="Filtrar por fuente">
          <option value="all">Todas las fuentes</option>
          <option value="manual">Mis descargas</option>
          <option value="billboard-hot-100">Billboard</option>
          <option value="itunes-us">iTunes USA</option>
          <option value="itunes-mx">iTunes México</option>
          <option value="itunes-es">iTunes España</option>
          <option value="itunes-ar">iTunes Argentina</option>
          <option value="itunes-co">iTunes Colombia</option>
          <option value="spotify-global">Spotify</option>
        </select>

        <select id="playlistFilter" title="Filtrar por lista">
          <option value="all">Todas las listas</option>
        </select>

        <div class="input-with-icon grow">
          <i class="fa-solid fa-cloud-arrow-down"></i>
          <input id="newTrack" type="text" placeholder="Descargar 1 canción (ej: Bad Bunny Monaco)">
        </div>

        <button id="downloadBtn">
          <i class="fa-solid fa-download"></i>
          <span>Descargar</span>
        </button>
      </div>
      <div id="status"></div>
      <div id="playlist"></div>
    </main>

    <!-- Vista: Charts -->
    <main id="view-charts" class="view">
      <div class="toolbar">
        <select id="chartSource" title="Fuente del chart"></select>
        <select id="chartLimit">
          <option value="5">Top 5</option>
          <option value="10" selected>Top 10</option>
          <option value="25">Top 25</option>
          <option value="50">Top 50</option>
          <option value="100">Top 100</option>
        </select>
        <button id="loadChartBtn" class="btn-secondary">
          <i class="fa-solid fa-eye"></i>
          <span>Ver chart</span>
        </button>
        <button id="downloadChartBtn">
          <i class="fa-solid fa-download"></i>
          <span>Descargar chart</span>
        </button>
      </div>
      <div id="chartStatus"></div>
      <div id="chartList" class="chart-list"></div>
    </main>

    <!-- Vista: Admin -->
    <main id="view-admin" class="view">
      <div class="toolbar">
        <h2 style="font-size: 1.1rem; color: #eee; display:flex; align-items:center; gap:.5rem; margin:0;">
          <i class="fa-solid fa-users" style="color:#1db954;"></i>
          Gestión de usuarios
        </h2>
        <button id="refreshUsersBtn" class="btn-secondary">
          <i class="fa-solid fa-rotate"></i>
          <span>Refrescar</span>
        </button>
      </div>
      <div id="adminStatus"></div>
      <div id="usersTable" class="users-table"></div>
    </main>

    <!-- Modal: Añadir a lista -->
    <div id="playlistModal" class="modal hidden">
      <div class="modal-content">
        <h3><i class="fa-solid fa-list-check"></i> Añadir a lista</h3>
        <div id="modalTrackName" class="modal-track-name"></div>
        <div id="playlistModalList" class="modal-list"></div>
        <div class="modal-new">
          <input id="newPlaylistInput" placeholder="Crear lista nueva...">
          <button id="createPlaylistBtn">
            <i class="fa-solid fa-plus"></i>
            <span>Crear</span>
          </button>
        </div>
        <div class="modal-actions">
          <button id="closeModalBtn" class="btn-secondary">
            <i class="fa-solid fa-xmark"></i>
            <span>Cerrar</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Modal: Editar usuario (admin) -->
    <div id="userModal" class="modal hidden">
      <div class="modal-content">
        <h3><i class="fa-solid fa-user-gear"></i> <span id="userModalTitle">Editar usuario</span></h3>
        <div id="userModalBody"></div>
        <div class="modal-actions" style="gap: 0.5rem; justify-content: flex-end;">
          <button id="userModalCancel" class="btn-secondary">
            <i class="fa-solid fa-xmark"></i>
            <span>Cancelar</span>
          </button>
          <button id="userModalSave">
            <i class="fa-solid fa-check"></i>
            <span>Guardar</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Reproductor fijo -->
    <footer class="player">
      <div class="player-info">
        <div id="nowPlaying">
          <i class="fa-solid fa-circle-pause"></i>
          <span>Sin reproducción</span>
        </div>
        <div id="trackMeta"></div>
      </div>
      <audio id="audio" controls></audio>
      <div class="controls">
        <button id="prevBtn" title="Anterior"><i class="fa-solid fa-backward-step"></i></button>
        <button id="nextBtn" title="Siguiente"><i class="fa-solid fa-forward-step"></i></button>
      </div>
    </footer>
  </div>

  <!-- Botón de instalación PWA (se muestra dinámicamente) -->
  <button id="installBtn" class="install-btn hidden" title="Instalar LuMi">
    <i class="fa-solid fa-download"></i>
    <span>Instalar App</span>
  </button>

  <script src="player.js"></script>
</body>
</html>
